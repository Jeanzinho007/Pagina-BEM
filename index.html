<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-12 col-lg-10">
                <div class="cajita">

                    <div class="row">
                        <div class="col-12">
                            <h2 class="bloque__titulo">
                                Iphone 18 Pro Max
                            </h2>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-12 col-md-5">
                            <div class="bloque__imagen">
                                <img src="1.jpeg" alt="imagen iphone" class="lol">
                            </div>
                        </div>

                        <div class="col-12 col-md-7">
                            <div class="bloque__info">

                                <p class="bloque__descripcion">
                                    Es el teléfono inteligente de mayor tamaño y gama alta de Apple, equipado con una pantalla OLED de 6.9 pulgadas y notables mejoras en fotografía y potencia.
                                </p>

                                <div class="bloque__precio">
                                    $ 6.500.000
                                </div>

                                <span class="bloque__estado bloque__estado--disponible">
                                    Disponible
                                </span>

                                <button type="button" class="btn bloque__boton">
                                    Comprar
                                </button>

                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</body>
</html>
